<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrecificaJá</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="loginView">
  <div class="loginBox">
    <h1>PrecificaJá</h1>
    <div class="note" style="margin-top:14px;">Autenticação ativada. Insira as suas credenciais.</div>
    
    <label style="font-size:13px;color:#6b7280;">E-mail ou Usuário</label>
    <input id="loginEmail" type="text" placeholder="exemplo@email.com">
    
    <label style="font-size:13px;color:#6b7280;margin-top:10px;display:block;">Senha</label>
    <input id="loginSenha" type="password" placeholder="Sua senha">
    
    <button onclick="doLogin()">Entrar</button>
    <div class="err" id="loginErr"></div>
    
    <div class="cfg">
      URL da API
      <input id="apiBaseInput" value="http://localhost:5000/api" oninput="API_BASE=this.value">
    </div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">📈 PrecificaJá</div>
    <div class="userbox">
      🔔 ⚙️
      <div class="avatar" id="avatarLetter">?</div>
      <span id="userName"></span>
      <button class="btn btn-outline" style="padding:4px 10px;" onclick="logout()">Sair</button>
    </div>
  </header>
  <nav id="navBar"></nav>
  <main id="mainView"></main>
</div>

<!-- Modal: criar/editar produto -->
<div class="modal-bg" id="produtoModalBg">
  <div class="modal">
    <h2 id="produtoModalTitle">Alterar produto</h2>
    <label>Nome</label><input id="f_nome">
    <label>Custo (R$)</label><input id="f_custo" type="number" step="0.01">
    <label>Preço atual (R$)</label><input id="f_preco" type="number" step="0.01">
    <label>Estoque</label><input id="f_estoque" type="number" step="1">
    <label>Validade (opcional)</label><input id="f_validade" type="date">
    <div class="err" id="produtoErr"></div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeProdutoModal()">Cancelar</button>
      <button class="btn btn-verde" id="produtoSaveBtn" onclick="saveProduto()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: registrar venda -->
<div class="modal-bg" id="vendaModalBg">
  <div class="modal">
    <h2>Registrar Venda</h2>
    <label>Selecionar produto</label>
    <select id="v_produto"></select>
    
    <label>Quantidade</label>
    <input id="v_qtd" type="number" value="1" min="1" step="1">
    
    <div class="row">
      <button class="btn btn-outline" onclick="closeVendaModal()">Cancelar</button>
      <button class="btn btn-verde" onclick="registrarVenda()">Registrar Venda</button>
    </div>
  </div>
</div>

<!-- Modal: Registar Preço Concorrente -->
<div class="modal-bg" id="concorrenciaModalBg">
  <div class="modal">
    <h2>Registar Preço da Concorrência</h2>
    <label>Produto</label>
    <input type="hidden" id="c_produto_id">
    <label>Valor na Concorrência (R$)</label>
    <input id="c_valor" type="number" step="0.01" min="0.01">
    <div class="row">
      <button class="btn btn-outline" onclick="closeConcorrenciaModal()">Cancelar</button>
      <button class="btn btn-verde" onclick="salvarConcorrencia()">Registar</button>
    </div>
  </div>
</div>

<!-- Modal: Registar Feedback do Cliente -->
<div class="modal-bg" id="feedbackModalBg">
  <div class="modal">
    <h2>Opinião do Cliente</h2>
    <div class="note">O que o cliente achou do preço deste produto?</div>
    
    <input type="hidden" id="f_fb_produto_id">
    
    <label>Nome do Cliente (Opcional)</label>
    <input id="f_fb_cliente" type="text" placeholder="Ex: Sr. João">
    
    <label>Comentário / Opinião</label>
    <input id="f_fb_comentario" type="text" placeholder="Ex: Achou muito caro face ao supermercado ao lado">
    
    <div class="err" id="feedbackErr" style="margin-top:10px;"></div>
    
    <div class="row">
      <button class="btn btn-outline" onclick="closeFeedbackModal()">Cancelar</button>
      <button class="btn btn-verde" onclick="salvarFeedback()">Registar Feedback</button>
    </div>
  </div>
</div>

<!-- Modal: Gerir Utilizador -->
<div class="modal-bg" id="usuarioModalBg">
  <div class="modal">
    <h2 id="usuarioModalTitle">Adicionar Membro</h2>
    
    <label>Nome Completo</label>
    <input id="u_name" type="text" placeholder="Ex: Bernardo Silva">
    
    <label>Nome de Utilizador (Login)</label>
    <input id="u_username" type="text" placeholder="Ex: bernardo.s">
    
    <label>Senha <span id="u_senha_hint" class="muted"></span></label>
    <input id="u_password" type="password" placeholder="***">
    
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
      <div>
        <label>Cargo</label>
        <select id="u_cargo">
          <option value="1">Admin</option>
          <option value="2">Gerente</option>
          <option value="3">Usuário</option>
        </select>
      </div>
      <div>
        <label>Status</label>
        <select id="u_status">
          <option value="true">Ativo</option>
          <option value="false">Inativo</option>
        </select>
      </div>
    </div>
    
    <div class="err" id="usuarioErr"></div>
    <div class="row">
      <button class="btn btn-outline" onclick="closeUsuarioModal()">Cancelar</button>
      <button class="btn btn-verde" onclick="saveUsuario()">Guardar</button>
    </div>
  </div>
</div>

<!-- Importa o JavaScript da pasta static -->
<script src="/static/js/api.js"></script>
<script src="/static/js/modais.js"></script>
<script src="/static/js/app.js"></script>


</body>
</html>
